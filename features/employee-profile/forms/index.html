<!doctype html>
<html lang="vi">
<head>
<base href="../../../">
<script src="shared/environment.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0968D2">
  <title>Cập nhật hồ sơ | HRM ESS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="features/dashboard/dashboard.css">
  <link rel="stylesheet" href="features/employee-profile/profile.css">
  <link rel="stylesheet" href="features/employee-profile/forms/profile-form.css">
  <script defer src="shared/components/header/menu-icons.js"></script>
  <script defer src="features/employee-profile/sections/fields.js"></script>
  <script defer src="data/fixtures/profile.js"></script>
  <script defer src="data/stores/profile-records.js"></script>
  <script defer src="features/employee-profile/forms/schema.js"></script>
  <script defer src="shared/components/header/notifications.js"></script>
  <script defer src="features/employee-profile/forms/profile-form.js"></script>
<link rel="stylesheet" href="shared/components/header/dropdown.css"><script defer src="shared/components/header/dropdown.js"></script>
<link rel="stylesheet" href="shared/components/footer/footer.css">
<link rel="stylesheet" href="features/employee-profile/forms/profile-form-modal.css"><link rel="stylesheet" href="shared/styles/tokens.css">
</head>
<body>
  <script src="shared/components/header/forms-header.js" data-ess-fragment="shared/components/header/forms-header.js"></script>

  <main class="profile-form-page">
    <div class="form-heading"><button id="backArrow" type="button" aria-label="Quay lại Thông tin nhân viên"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h13"/></svg></button><h1 id="formTitle"></h1></div>
    <form id="profileForm" class="profile-form-card" novalidate><div id="formFields" class="form-grid"></div></form>
  </main>
<script src="shared/components/footer/dashboard-footer.js" data-ess-fragment="shared/components/footer/dashboard-footer.js"></script>
  <footer class="form-footer"><div class="form-footer-inner"><button id="backFooter" class="secondary-button" type="button">Quay lại</button><button id="submitForm" class="primary-button" type="button">Gửi yêu cầu cập nhật</button></div></footer>

  <div id="modalOverlay" class="form-modal-overlay" hidden>
    <section class="form-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">
      <button id="modalClose" class="form-modal-close" type="button" aria-label="Đóng thông báo" hidden>×</button>
      <div id="modalIcon" class="form-modal-icon" hidden><svg viewBox="0 0 64 64" width="58" height="58" fill="none" aria-hidden="true"><circle cx="31" cy="31" r="27" fill="#E6F2FF"/><path d="m16 30 31-13-11 31-6-12-14-6Z" stroke="#0968D2" stroke-width="2.5" stroke-linejoin="round"/><path d="m30 36 17-19" stroke="#0968D2" stroke-width="2.5"/><circle cx="48" cy="47" r="10" fill="#29A352"/><path d="m44 47 3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <h2 id="modalTitle"></h2><p id="modalBody"></p>
      <div id="modalActions" class="form-modal-actions"><button id="modalSecondary" class="secondary-button" type="button"></button><button id="modalPrimary" class="primary-button" type="button"></button></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMessage"></span><button id="toastUndo" class="toast-undo" type="button" hidden>Hoàn tác</button><button id="toastClose" type="button" aria-label="Đóng thông báo">×</button></div>
</body>
</html>
