  <script src="shared/components/header/manage-tasks-header.js" data-ess-fragment="shared/components/header/manage-tasks-header.js"></script>
<div id="taskDrawerBackdrop" class="task-drawer-backdrop" aria-hidden="true" hidden></div><div class="ess-admin-layout tasks-layout" data-navigation-storage="hrm-ess-task-navigation-collapsed">
<script src="shared/components/sidebar/manage-tasks-sidebar.js" data-ess-fragment="shared/components/sidebar/manage-tasks-sidebar.js"></script>
<main class="my-tasks-page" id="main"></main>
</div>

<dialog id="statusDialog" aria-labelledby="statusHeading" aria-describedby="changeTitle statusDescription"><div class="task-confirm-heading"><span id="statusIcon" class="task-status-icon" aria-hidden="true"></span><h2 id="statusHeading"></h2></div><p id="changeTitle"></p><p id="statusDescription" class="muted"></p><p id="statusError" class="form-error" role="alert" hidden></p><form id="statusForm"><div class="dialog-actions"><button class="btn" type="button" id="dismissStatus">Go back</button><button class="btn primary" type="submit" id="confirmStatus"></button></div></form></dialog><div id="statusToast" role="status" aria-live="polite" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMessage"></span><button id="toastUndo" type="button" hidden>Undo</button><button id="toastClose" type="button" aria-label="Close notification">×</button></div>
<dialog id="calendarDay" aria-labelledby="dayTitle"><div class="dialog-header"><h2 id="dayTitle"></h2><button type="button" class="dialog-close" aria-label="Close day tasks">×</button></div><div class="day-list" id="dayList"></div></dialog>
<section class="month-picker" id="monthPicker" role="dialog" aria-label="Choose month and year" aria-modal="false" hidden></section>
<aside id="taskWorkspaceDrawer" class="task-workspace-drawer" role="dialog" aria-modal="true" aria-labelledby="taskWorkspaceTitle" hidden>
<div class="task-workspace-header"><h2 id="taskWorkspaceTitle" tabindex="-1"></h2><button id="closeTaskWorkspace" class="task-ticket-drawer-close" type="button" aria-label="Close task drawer">×</button></div>
<div id="taskWorkspaceBody" class="my-tasks-page task-workspace-body"></div>
<div id="taskWorkspaceFooter" class="task-workspace-footer" hidden></div>
</aside>
<dialog id="createTaskExitDialog" class="task-exit-confirm" aria-labelledby="createTaskExitTitle" aria-describedby="createTaskExitDescription">
<h2 id="createTaskExitTitle">Xác nhận quay lại</h2>
<p id="createTaskExitDescription">Thông tin đã thay đổi sẽ không được lưu. Bạn có chắc chắn muốn quay lại?</p>
<div class="task-exit-confirm-actions"><button id="createTaskStay" class="btn" type="button" autofocus>Ở lại</button><button id="createTaskLeave" class="btn primary" type="button">Quay lại</button></div>
</dialog>
