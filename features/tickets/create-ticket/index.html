<!doctype html><html data-ess-feature="create-ticket" lang="en"><head>
<base href="../../../">
<script src="shared/environment.js"></script>
<script src="data/embedded-pages.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tickets — Unified v10</title><link rel="stylesheet" href="features/tickets/shared/ticket-host.css"><link rel="stylesheet" href="shared/components/header/header.css"><link rel="stylesheet" href="shared/components/header/dropdown.css"><link rel="stylesheet" href="features/tickets/shared/ticket-host-2.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="features/tickets/components/tickets.css"><link rel="stylesheet" href="shared/components/footer/footer.css">
<link rel="stylesheet" href="shared/components/sidebar/sidebar.css"><link rel="stylesheet" href="features/tickets/components/sidebar.css">
<link rel="stylesheet" href="shared/components/table/table.css"><script defer src="shared/components/table/table.js"></script><link rel="stylesheet" href="shared/styles/tokens.css">
<script defer src="shared/layouts/feature-navigation.js"></script>
</head><body class="tickets-host"><script src="shared/components/header/ticket-host-header.js" data-ess-fragment="shared/components/header/ticket-host-header.js"></script>
<div class="ess-admin-layout tickets-layout" id="ticketLayout">
<script src="shared/components/sidebar/ticket-host-sidebar.js" data-ess-fragment="shared/components/sidebar/ticket-host-sidebar.js"></script>
<main class="tickets-main">
<section class="top" id="top"><div class="heading"><div><h1 id="ticketPageTitle">Tickets</h1></div><div class="actions"><button id="createTicketAction" class="btn primary" onclick="route('catalog')">+ New ticket</button></div></div><div class="subheading"><button class="btn" onclick="route(lastTab)">← Back to Tickets</button><h2 id="subTitle"></h2></div></section>
<div class="workspace" id="workspace"><div class="load" id="loading">Loading Tickets…</div><iframe id="employee" title="My tickets, request forms and workflow" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals"></iframe><iframe id="manager" title="Approvals, processed history and delegation" sandbox="allow-scripts allow-same-origin allow-downloads allow-modals" hidden></iframe></div>
</main></div>
<div class="toast" id="outerToast" role="status" hidden></div>
<dialog id="delegationCancelDialog" class="delegation-cancel-dialog" aria-labelledby="delegationCancelTitle" aria-describedby="delegationCancelPeople"><div class="delegation-cancel-heading" id="delegationCancelTitle">Cancel delegation</div><div class="delegation-cancel-body"><p id="delegationCancelPeople"></p></div><div class="delegation-cancel-actions"><button class="btn" id="delegationCancelKeep" type="button" autofocus onclick="finishDelegationCancel(false)">Keep delegation</button><button class="btn delegation-cancel-danger" id="delegationCancelConfirm" type="button" onclick="finishDelegationCancel(true)">Confirm cancellation</button></div></dialog>
<dialog id="delegationEditDialog" class="delegation-cancel-dialog delegation-edit-dialog" aria-labelledby="delegationEditTitle" aria-describedby="delegationEditPeople"><div class="delegation-cancel-heading" id="delegationEditTitle">Edit delegation</div><div class="delegation-cancel-body"><p id="delegationEditPeople" class="delegation-edit-people"></p><div class="delegation-edit-dates"><div class="field"><label for="delegationEditFrom">From date</label><input id="delegationEditFrom" type="date" disabled></div><div class="field"><label for="delegationEditUntil">To date</label><input id="delegationEditUntil" type="date" aria-describedby="delegationEditError" required></div></div><div id="delegationEditError" class="delegation-edit-error" role="alert"></div></div><div class="delegation-cancel-actions"><button class="btn" type="button" onclick="finishDelegationEdit(false)">Close</button><button id="delegationEditSave" class="btn delegation-edit-save" type="button" onclick="finishDelegationEdit(true)">Save</button></div></dialog>
<dialog id="bulkDecisionDialog" class="delegation-cancel-dialog" aria-labelledby="bulkDecisionTitle" aria-describedby="bulkDecisionDescription"><div class="delegation-cancel-heading" id="bulkDecisionTitle"></div><div class="delegation-cancel-body"><p id="bulkDecisionDescription">Each selected ticket will be processed separately and recorded in history.</p><div class="field delegation-edit-people"><label id="bulkDecisionLabel" for="bulkDecisionReason">Comment</label><textarea id="bulkDecisionReason" class="bulk-decision-reason" aria-describedby="bulkDecisionError"></textarea></div><div id="bulkDecisionError" class="delegation-edit-error" role="alert"></div></div><div class="delegation-cancel-actions"><button class="btn" id="bulkDecisionCancel" type="button" onclick="finishBulkDecision(false)">Cancel</button><button class="btn delegation-edit-save" id="bulkDecisionConfirm" type="button" onclick="finishBulkDecision(true)">Confirm</button></div></dialog>
<dialog id="ticketDrawerDialog" class="ticket-drawer-dialog" aria-label="Ticket drawer"><iframe id="ticketDrawerFrame" title="Ticket details or delegation form"></iframe></dialog>
<script src="features/tickets/components/drawer-portal.js"></script><script src="features/tickets/shared/ticket-service.js"></script><script src="features/tickets/shared/ticket-host.js" data-ess-extracted="features/tickets/shared/ticket-host.js"></script><div id="toast" role="status" hidden><span id="toastMessage"></span><button id="toastUndo" hidden>Undo</button><button id="toastClose" aria-label="Close notification">×</button></div><div id="statusToast" role="status" hidden></div><script defer src="shared/components/header/menu-icons.js"></script><script defer src="shared/components/header/notifications.js"></script><script defer src="shared/layouts/employee-layout.js"></script><script src="shared/components/footer/dashboard-footer.js" data-ess-fragment="shared/components/footer/dashboard-footer.js"></script>
<script src="features/tickets/components/sidebar.js"></script></body></html>
